[package]
name = "omnidrop-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico", "avif", "rayon"] }
webp = { version = "0.3.1", default-features = false }
lopdf = "0.46"
hayro = "0.8"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
which = "8"
log = "0.4"
ts-rs = "12"
