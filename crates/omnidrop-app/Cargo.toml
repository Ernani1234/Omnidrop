[package]
name = "omnidrop-app"
description = "Application model shared by the OmniDrop shell and UI: settings, history, event payloads and previews"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
omnidrop-engine = { path = "../omnidrop-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico"] }
hayro = "0.8"
base64 = "0.22"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
